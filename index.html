<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Kay Jayson</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Arial, sans-serif;
      background: white;
    }

    .box {
      width: 90%;
      max-width: 500px;

      padding: 35px 20px;

      text-align: center;

      background: white;
      border-radius: 25px;

      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);

      animation: pop 0.8s ease;
    }

    h1 {
      margin: 0;
      color: #ff4081;
      font-size: 30px;
    }

    p {
      font-size: 22px;
      margin-top: 15px;
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: scale(0.5);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>TANGINA MO JAYSON HAHAHA</h1>
    <p>😭😭😭</p>
  </div>

</body>
</html>
