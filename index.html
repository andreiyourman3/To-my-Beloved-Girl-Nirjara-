<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Good Morning ❤️</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffb6c1, #ffd6a5);
      text-align: center;
      color: white;
    }

    .message {
      padding: 30px;
      max-width: 600px;
    }

    h1 {
      font-size: 45px;
      margin-bottom: 20px;
    }

    #text {
      font-size: 20px;
      line-height: 1.7;
      min-height: 150px;
    }

    .heart {
      font-size: 45px;
      animation: heartbeat 1.2s infinite;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.2);
      }
    }
  </style>
</head>

<body>

  <div class="message">
    <div class="heart">❤️</div>

    <h1>Good Morning, My Love ☀️</h1>

    <p id="text"></p>
  </div>

  <script>
    const message = `Good morning, my love. ❤️

I hope you slept well and woke up feeling happy today.

I just want you to know that you're one of the first things I think about when I wake up.

No matter how far apart we are, I hope you always remember that someone here is thinking about you and loving you.

Have a beautiful day, my love. 🌷

Take care always. I love you. ❤️`;

    let i = 0;
    const speed = 40;

    function typeWriter() {
      if (i < message.length) {
        document.getElementById("text").innerHTML +=
          message.charAt(i) === "\n"
            ? "<br>"
            : message.charAt(i);

        i++;
        setTimeout(typeWriter, speed);
      }
    }

    typeWriter();
  </script>

</body>
</html>
