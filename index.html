<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You 💐</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    width: 100%;
    min-height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: linear-gradient(#ffe1ed, #fff7fa);
}

.page {
    width: 100%;
    max-width: 430px;
    height: 100vh;
    margin: auto;
    position: relative;
    text-align: center;
    padding-top: 65px;
}

.title {
    color: #b83268;
    font-size: 29px;
    font-weight: bold;
}

.subtitle {
    margin-top: 12px;
    color: #87566c;
    font-size: 18px;
}

/* =========================
   BOUQUET
========================= */

.bouquet {
    position: absolute;
    width: 360px;
    height: 500px;
    left: 50%;
    top: 170px;
    transform: translateX(-50%);
}

svg {
    width: 100%;
    height: 100%;
    overflow: visible;
}

/* bouquet opening */

.flowerGroup {
    transition: transform 1s cubic-bezier(.2,.8,.2,1);
}

.bouquet.open .leftFlower {
    transform: translateX(-12px) rotate(-8deg);
}

.bouquet.open .rightFlower {
    transform: translateX(12px) rotate(8deg);
}

.bouquet.open .centerFlower {
    transform: translateY(-12px);
}

.bouquet.open .wrapper {
    transform: translateY(65px);
}

.bouquet.open .ribbon {
    transform: translateY(65px);
}

/* =========================
   MESSAGE
========================= */

.message {
    position: absolute;
    width: 315px;
    max-width: calc(100vw - 40px);

    left: 50%;
    bottom: -20px;

    transform: translate(-50%, 50px) scale(.8);

    opacity: 0;

    background: white;
    border-radius: 25px;

    padding: 24px;

    box-shadow:
        0 15px 40px rgba(150, 70, 110, .20);

    transition: .8s ease;

    z-index: 20;
}

.open .message {
    transform: translate(-50%, 0) scale(1);
    opacity: 1;
}

.message h2 {
    color: #c43d72;
    font-size: 27px;
    margin-bottom: 14px;
}

.message p {
    color: #765666;
    font-size: 16px;
    line-height: 1.6;
}

/* =========================
   BUTTON
========================= */

button {
    position: fixed;

    left: 50%;
    bottom: 18px;

    transform: translateX(-50%);

    border: none;
    border-radius: 30px;

    padding: 14px 28px;

    background: #c83f72;
    color: white;

    font-size: 16px;

    box-shadow: 0 8px 20px rgba(200, 63, 114, .25);

    z-index: 50;
}

button:active {
    transform: translateX(-50%) scale(.95);
}

/* =========================
   FALLING PETALS
========================= */

.falling {
    position: fixed;
    top: -30px;
    z-index: 100;
    pointer-events: none;

    animation: fall linear forwards;
}

@keyframes fall {
    to {
        transform:
            translateY(110vh)
            rotate(500deg);

        opacity: 0;
    }
}
</style>
</head>

    <button onclick="openBouquet()">

<script>

let opened = false;

function openBouquet() {

    const bouquet =
        document.getElementById("bouquet");

    opened = !opened;

    if (opened) {

        bouquet.classList.add("open");

        /* falling flowers */

        for (let i = 0; i < 25; i++) {

            setTimeout(() => {

                const flower =
                    document.createElement("div");

                flower.className = "falling";

                flower.innerHTML = "🌸";

                flower.style.left =
                    Math.random() * 100 + "vw";

                flower.style.fontSize =
                    (15 + Math.random() * 15) + "px";

                flower.style.animationDuration =
                    (3 + Math.random() * 3) + "s";

                document.body.appendChild(flower);

                setTimeout(() => {
                    flower.remove();
                }, 6000);

            }, i * 100);

        }

    } else {

        bouquet.classList.remove("open");

    }

}

</script>
