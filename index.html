<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bouquet 🌷</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #fff0f5;
}

.bouquet {
    position: relative;
    width: 380px;
    height: 500px;
}

/* STEMS */
.stem {
    position: absolute;
    bottom: 105px;
    left: 50%;
    width: 7px;
    height: 260px;
    background: #3d873f;
    border-radius: 10px;
    transform-origin: bottom;
}

.s1 { transform: rotate(-30deg); }
.s2 { transform: rotate(-15deg); }
.s3 { transform: rotate(0deg); }
.s4 { transform: rotate(15deg); }
.s5 { transform: rotate(30deg); }

/* LEAVES */
.leaf {
    position: absolute;
    width: 65px;
    height: 30px;
    background: #4c984c;
    border-radius: 100% 0 100% 0;
}

.l1 {
    left: 60px;
    bottom: 220px;
    transform: rotate(-25deg);
}

.l2 {
    right: 55px;
    bottom: 235px;
    transform: scaleX(-1) rotate(-25deg);
}

.l3 {
    left: 90px;
    bottom: 170px;
    transform: rotate(15deg);
}

.l4 {
    right: 80px;
    bottom: 175px;
    transform: scaleX(-1) rotate(15deg);
}

/* FLOWER */
.flower {
    position: absolute;
    width: 120px;
    height: 120px;
}

.f1 { left: 15px; top: 110px; }
.f2 { left: 85px; top: 50px; }
.f3 { left: 130px; top: 5px; }
.f4 { right: 85px; top: 50px; }
.f5 { right: 10px; top: 110px; }

/* PETALS */
.petal {
    position: absolute;
    width: 52px;
    height: 72px;
    left: 50%;
    top: 50%;
    margin-left: -26px;
    margin-top: -36px;
    border-radius: 50% 50% 45% 45%;
    transform-origin: center bottom;
}

.pink .petal {
    background: linear-gradient(#ffb6c9, #ed4f7b);
}

.white .petal {
    background: linear-gradient(#ffffff, #e9dce1);
}

.peach .petal {
    background: linear-gradient(#ffd0b8, #f28b68);
}

.lavender .petal {
    background: linear-gradient(#e1c6f5, #9b6ac7);
}

/* 8 COMPLETE PETALS */
.p1 { transform: rotate(0deg) translateY(-32px); }
.p2 { transform: rotate(45deg) translateY(-32px); }
.p3 { transform: rotate(90deg) translateY(-32px); }
.p4 { transform: rotate(135deg) translateY(-32px); }
.p5 { transform: rotate(180deg) translateY(-32px); }
.p6 { transform: rotate(225deg) translateY(-32px); }
.p7 { transform: rotate(270deg) translateY(-32px); }
.p8 { transform: rotate(315deg) translateY(-32px); }

/* CENTER */
.center {
    position: absolute;
    width: 34px;
    height: 34px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: #ffc928;
    z-index: 5;
}

/* WRAPPER */
.wrapper {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 270px;
    height: 190px;
    background: linear-gradient(
        135deg,
        #f2b8ca,
        #fff1f6,
        #dfa0b8
    );
    clip-path: polygon(
        10% 0,
        90% 0,
        100% 100%,
        0 100%
    );
    z-index: 10;
}

/
