<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Bouquet For You 💐</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    font-family: Arial, sans-serif;
    background: linear-gradient(180deg, #ffe4ef, #fff7fa);
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    text-align: center;
    padding: 70px 20px 30px;
}

h1 {
    color: #b83268;
    font-size: 29px;
    margin-bottom: 10px;
}

.subtitle {
    color: #8d5870;
    font-size: 18px;
    margin-bottom: 35px;
}

/* BOUQUET */

.bouquet {
    position: relative;
    width: 330px;
    height: 390px;
    margin: auto;
    cursor: pointer;
}

/* stems */

.stem {
    position: absolute;
    width: 7px;
    height: 190px;
    background: #4d9b61;
    border-radius: 10px;
    bottom: 115px;
    left: 50%;
    transform-origin: bottom;
    z-index: 1;
}

.s1 { transform: rotate(-25deg); }
.s2 { transform: rotate(-12deg); }
.s3 { transform: rotate(0deg); }
.s4 { transform: rotate(13deg); }
.s5 { transform: rotate(27deg); }

/* leaves */

.leaf {
    position: absolute;
    width: 65px;
    height: 28px;
    background: #65ad70;
    border-radius: 100% 0 100% 0;
    z-index: 2;
}

.l1 {
    left: 65px;
    bottom: 190px;
    transform: rotate(20deg);
}

.l2 {
    right: 55px;
    bottom: 180px;
    transform: rotate(155deg);
}

.l3 {
    left: 125px;
    bottom: 160px;
    transform: rotate(-15deg);
}

/* flowers */

.flower {
    position: absolute;
    width: 80px;
    height: 80px;
    z-index: 5;
    transition: transform 1s cubic-bezier(.2,.8,.2,1);
}

.f1 {
    left: 35px;
    top: 105px;
}

.f2 {
    left: 105px;
    top: 55px;
}

.f3 {
    left: 175px;
    top: 100px;
}

.f4 {
    left: 75px;
    top: 145px;
}

.f5 {
    left: 150px;
    top: 150px;
}

/* petals */

.petal {
    position: absolute;
    width: 35px;
    height: 48px;
    background: #ff6b9d;
    border-radius: 50% 50% 45% 45%;
    left: 22px;
    top: 10px;
    transform-origin: 50% 100%;
}

.p1 { transform: rotate(0deg) translateY(-16px); }
.p2 { transform: rotate(72deg) translateY(-16px); }
.p3 { transform: rotate(144deg) translateY(-16px); }
.p4 { transform: rotate(216deg) translateY(-16px); }
.p5 { transform: rotate(288deg) translateY(-16px); }

.center {
    position: absolute;
    width: 27px;
    height: 27px;
    background: #ffd35c;
    border-radius: 50%;
    left: 27px;
    top: 27px;
    z-index: 10;
}

/* wrapping */

.wrapper {
    position: absolute;
    bottom: 5px;
    left: 50%;
    transform: translateX(-50%);
    width: 245px;
    height: 145px;
    background: linear-gradient(135deg, #df7da1, #c95b84);
    clip-path: polygon(8% 0, 92% 0, 78% 100%, 22% 100%);
    z-index: 10;
    transition: 1s;
}

.wrapper::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 25px;
    background: #f4d05e;
    top: 60px;
    left: 0;
}

.ribbon {
    position: absolute;
    width: 25px;
    height: 145px;
    background: #f4d05e;
    left: 110px;
}

/* bow */

.bow {
    position: absolute;
    width: 80px;
    height: 50px;
    left: 125px;
    bottom: 115px;
    z-index: 15;
}

.bow-left,
.bow-right {
    position: absolute;
    width: 45px;
    height: 35px;
    background: #f4d05e;
    top: 5px;
}

.bow-left {
    left: 0;
    border-radius: 50% 10% 50% 50%;
    transform: rotate(15deg);
}

.bow-right {
    right: 0;
    border-radius: 10% 50% 50% 50%;
    transform: rotate(-15deg);
}

.bow-center {
    position: absolute;
    width: 25px;
    height: 25px;
    background: #d9ae39;
    border-radius: 50%;
    left: 28px;
    top: 10px;
    z-index: 3;
}

/* message */

.message {
    position: absolute;
    width: 310px;
    left: 50%;
    bottom: -80px;
    transform: translateX(-50%) scale(0);
    opacity: 0;
    background: white;
    border-radius: 25px;
    padding: 25px;
    box-shadow: 0 15px 40px rgba(160,70,110,.18);
    transition: 1s;
    z-index: 30;
}

.message h2 {
    color: #c33f72;
    margin-bottom: 15px;
}

.message p {
    color: #765666;
    line-height: 1.6;
    font-size: 16px;
}

/* opened */

.open .wrapper {
    transform: translateX(-50%) translateY(70px);
}

.open .bow {
    transform: translateY(70px);
}

.open .message {
    transform: translateX(-50%) scale(1);
    opacity: 1;
}

/* button */

button {
    margin-top: 20px;
    border: none;
    background: #c83f72;
    color: white;
    padding: 14px 28px;
    border-radius: 30px;
    font-size: 16px;
    box-shadow: 0 8px 20px rgba(200,63,114,.25);
    cursor: pointer;
}

button:active {
    transform: scale(.95);
}

/* floating petals */

.falling {
    position: fixed;
    top: -30px;
    pointer-events: none;
    animation: fall 5s linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(600deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>A little bouquet for you 💐</h1>
    <p class="subtitle">Tap the bouquet 🌷</p>

    <div class="bouquet" id="bouquet">

        <!-- stems -->
        <div class="stem s1"></div>
        <div class="stem s2"></div>
        <div class="stem s3"></div>
        <div class="stem s4"></div>
        <div class="stem s5"></div>

        <!-- leaves -->
        <div class="leaf l1"></div>
        <div class="leaf l2"></div>
        <div class="leaf l3"></div>

        <!-- flower 1 -->
        <div class="flower f1">
            <span class="petal p1"></span>
            <span class="petal p2"></span>
            <span class="petal p3"></span>
            <span class="petal p4"></span>
            <span class="petal p5"></span>
            <span class="center"></span>
        </div>

        <!-- flower 2 -->
        <div class="flower f2">
            <span class="petal p1"></span>
            <span class="petal p2"></span>
            <span class="petal p3"></span>
            <span class="petal p4"></span>
            <span class="petal p5"></span>
            <span class="center"></span>
        </div>

        <!-- flower 3 -->
        <div class="flower f3">
            <span class="petal p1"></span>
            <span class="petal p2"></span>
            <span class="petal p3"></span>
            <span class="petal p4"></span>
            <span class="petal p5"></span>
            <span class="center"></span>
        </div>

        <!-- flower 4 -->
        <div class="flower f4">
            <span class="petal p1"></span>
            <span class="petal p2"></span>
            <span class="petal p3"></span>
            <span class="petal p4"></span>
            <span class="petal p5"></span>
            <span class="center"></span>
        </div>

        <!-- flower 5 -->
        <div class="flower f5">
            <span class="petal p1"></span>
            <span class="petal p2"></span>
            <span class="petal p3"></span>
            <span class="petal p4"></span>
            <span class="petal p5"></span>
            <span class="center"></span>
        </div>

        <!-- wrapper -->
        <div class="wrapper">
            <div class="ribbon"></div>
        </div>

        <!-- bow -->
        <div class="bow">
            <div class="bow-left"></div>
            <div class="bow-right"></div>
            <div class="bow-center"></div>
        </div>

        <!-- message -->
        <div class="message">
            <h2>For You 💗</h2>
            <p>
                I may not be able to give you a real
                bouquet right now, so I made this
                little one just for you. 🌷
                <br><br>
                Every flower here carries a little bit
                of my love. ❤️
            </p>
        </div>

    </div>

    <button onclick="openBouquet()">Open Bouquet 💐</button>

</div>

<script>
let opened = false;

function openBouquet() {

    const bouquet = document.getElementById("bouquet");

    opened = !opened;

    if (opened) {

        bouquet.classList.add("open");

        for (let i = 0; i < 25; i++) {

            setTimeout(() => {

                const petal = document.createElement("div");

                petal.className = "falling";
                petal.innerHTML = "🌸";

                petal.style.left = Math.random() * 100 + "vw";
                petal.style.fontSize =
                    (14 + Math.random() * 18) + "px";

                petal.style.animationDuration =
                    (3 + Math.random() * 3) + "s";

                document.body.appendChild(petal);

                setTimeout(() => {
                    petal.remove();
                }, 6000);

            }, i * 100);
        }

    } else {

        bouquet.classList.remove("open");

    }
}
</script>

</body>
</html>
